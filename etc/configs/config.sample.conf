# Installed by the .deb as /etc/default/wt61.conf, which the binary reads: edit
# it there, then
#   sudo systemctl restart wt61-driver
# From source (bun run, development only): copy to etc/configs/config.conf in the
# working directory, or pass --config <file>.
# Without a config file the driver runs on the defaults shown here.

# Serial devices, comma-separated. Only the first is read.
# /dev/serial/by-id/... survives re-enumeration better than /dev/ttyUSB0.
DEVICES="/dev/ttyUSB0"

# The module's baud rate: 115200 streams 100 Hz (factory default), 9600 only 20 Hz.
BAUD_RATE=115200

# Where microservice.hm connects (WT61_URL=tcp://HOST:PORT). Loopback by default;
# 0.0.0.0 only if the consumer runs in a container without host networking.
HOST="127.0.0.1"
PORT=6699
